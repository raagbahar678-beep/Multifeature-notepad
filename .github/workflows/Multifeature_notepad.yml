name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # Fix #1: ubuntu-22.04, not ubuntu-latest — ubuntu-latest (24.04) breaks
    # the libffi/autoreconf step used by python-for-android's build tooling.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fix #2: pin Python to 3.11.9 — newer 3.x versions don't have
      # compatible prebuilt wheels for some p4a recipes.
      - name: Set up Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      # Fix #4: explicitly set JAVA_HOME to Java 17 before building, or the
      # Gradle step inside buildozer fails.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Export JAVA_HOME
        run: echo "JAVA_HOME=${{ env.JAVA_HOME_17_X64 }}" >> "$GITHUB_ENV"

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev build-essential \
            libltdl-dev

      - name: Install buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Cache buildozer / .android / .gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            ~/.android
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # Fix #5: auto-accept the Android SDK license prompts, or the first
      # build on a fresh runner hangs waiting for interactive input.
      #
      # `tee` writes everything to build.log AND still shows it live in the
      # Actions log, so we get a downloadable file without building twice.
      # `set -o pipefail` makes sure the step still fails/succeeds based on
      # buildozer's exit code, not tee's.
      #
      # Fix #6: `yes` reliably dies with SIGPIPE (non-zero exit) once
      # buildozer stops reading stdin, even on a fully successful build.
      # With `pipefail`, that non-zero exit propagates and fails the step
      # even though buildozer and tee both succeeded — this bit us on a
      # run where the APK built fine but the step still reported failure.
      # `yes` is only there to auto-accept license prompts and its exit
      # code is meaningless, so mask it with `|| true` and rely on
      # PIPESTATUS to check buildozer's real exit code explicitly.
      - name: Build APK (debug)
        shell: bash
        run: |
          set -o pipefail
          (yes || true) | buildozer -v android debug 2>&1 | tee build.log
          exit ${PIPESTATUS[1]}

      - name: Locate built APK
        id: find_apk
        if: always()
        run: |
          APK_PATH=$(find bin -name "*.apk" 2>/dev/null | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK_PATH"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            .buildozer/**/logs/*
          if-no-files-found: warn

      - name: Upload APK artifact
        if: steps.find_apk.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: latex-notepad-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          
